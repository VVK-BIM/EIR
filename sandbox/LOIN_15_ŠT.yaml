ŠT:
    id: "15"
    name: Šilumos gamyba
    stages:
      s1:
        lod: 275
        log: 2
        properties:
          Pset_ManufacturerTypeInformation.ArticleNumber: {}
          Pset_ManufacturerTypeInformation.Manufacturer: {}
      s2:
        lod: 200
        log: 2
      s3:
        lod: 300
        log: 2
      s4:
        lod: 350
        log: 2
        properties:
          Pset_ManufacturerTypeInformation.ArticleNumber: {}
          Pset_ManufacturerTypeInformation.Manufacturer: {}
      s5:
        lod: 350
        log: 2
        properties:
          VVK.RelatedDocumentationURI: {}
      s6:
        lod: 500
        log: 2
    elements:
    
    - id: Tinklo mechaninė apsauga                              # 1_3456 NSIK+ISO:  H.HD.FNB
      classifications:
        NSIK LF: H
        NSIK LT: HD
        NSIK LK: FNB
        
        ISO81346 CF: H
        ISO81346 CT: HD
        ISO81346 CC: FNB
      ifcType: *type_linear
      stages: 
        <<: *stages_protection_round

    - id: Sklendė                                               # 1_3456 NSIK+ISO:  H.HD.RNA
      examples:
      - Ventilis
      - Sklendė
      classifications:
        NSIK LF: H
        NSIK LT: HD
        NSIK LK: RNA
        ISO81346 CF: H
        ISO81346 CT: HD
        ISO81346 CC: RNA
      ifcType: *type_flow
      stages:  
        <<: *stages_s1_s3_s4_valve
        
    - id: Šildymo sistemos izoliacija                           # 1_3456 NSIK+ISO:  H.HD.RQA         Uc: Pr_25_57_06
      classifications:
        NSIK LF: H
        NSIK LT: HD
        NSIK LK: RQA
        Uniclass: Pr_25_57_06
        ISO81346 CF: H
        ISO81346 CT: HD
        ISO81346 CC: RQA
      ifcType: *type_covering
      stages: 
        <<: *stages_s1_s4_insulation

    - id: Vamzdis                                               # 1_3456 NSIK+ISO:  H.HD.WPA         Uc: Pr_65_52_63
      classifications:
        NSIK LF: H
        NSIK LT: HD
        NSIK LK: WPA
        Uniclass: Pr_65_52_63
        ISO81346 CF: H
        ISO81346 CT: HD
        ISO81346 CC: WPA
      ifcType: 
      - IfcPipeSegment
