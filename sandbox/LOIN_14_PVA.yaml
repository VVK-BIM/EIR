stages_sensor: &stages_s1_s2_s3_s4_s5_s6_sensor
  s1: 
    lod: 275
    properties:
      <<: [*prop, *prop_g, *prop_vis, *prop_u, *prop_e_sensor]
  s3: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g, *prop_vis_material, *prop_vis_colour]
  s4: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g, *prop_vis_material, *prop_vis_colour, *prop_e_sensor]
  s5: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g, *prop_vis_material, *prop_vis_colour, *prop_e_sensor]
  s6: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g, *prop_vis_material, *prop_vis_colour, *prop_e_sensor]

stages_equipment: &stages_s1_s2_s3_s4_s5_s6_equipment
  s1:
    lod: 275
    log: 2
    properties:
      <<: [*prop_u, *prop_g_eq, *prop_vis_colour, *prop_e, *prop_equipment]
  s3: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g_eq, *prop_vis_colour, *prop_e]
  s4: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g_eq, *prop_vis_colour, *prop_e, *prop_equipment]
  s5: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g_eq, *prop_vis_colour, *prop_e, *prop_equipment]
  s6: 
    lod: 300
    log: 2
    properties:
      <<: [*prop_u, *prop_g_eq, *prop_vis_colour, *prop_e, *prop_equipment]



