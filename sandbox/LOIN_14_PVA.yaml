# 14 - Procesų valdymas ir automatizavimas
#


prop:     &prop
  VVK.Name: {}
  VVK.ElementType: {}
  Pset_ConstructionAdministration.SpecificationSectionNumber: {}
  Pset_ElementComponentCommon.Status: {}
  Pset_ElementCommon.System: {}
  
  
prop_g:   &prop_g
  Pset_QuantityTakeOff.Height: 
    valueType: Integer | Real 
  Pset_QuantityTakeOff.Width: 
    valueType: Integer | Real 
  Pset_QuantityTakeOff.Length: 
    valueType: Integer | Real 


# test it. Should fail
prop_g_eq:   &prop_g_eq
  Pset_QuantityTakeOff.Height: 
    override:
      description: Vertikalus, lygiagretus vaizdo plokštumai matmuo, kai elementas yra projektinėje padėtyje
  Pset_QuantityTakeOff.Width:
    override:
      description: Horizontalus, lygiagretus vaizdo plokštumai matmuo, kai elementas yra projektinėje padėtyje
  Pset_QuantityTakeOff.Length: 
    override:
      description: Statmenas vaizdo plokštumai matmuo, kai elementas yra projektinėje padėtyje
        
prop_ga:   &prop_g_area
  <<: *prop_g
  Pset_QuantityTakeOff.Area: 
    valueType: Integer | Real 


prop_u:     &prop_u
  <<: *prop
  VVK.Tag: {}

prop_vis:  &prop_vis_material
  VVK.Material: {}

prop_vis:  &prop_vis_finish
  VVK.Finish: {}

prop_vis:  &prop_vis_colour
  VVK.Colour: {}


prop_vis:     &prop_vis
  <<: *prop_vis_material
  <<: *prop_vis_finish
  <<: *prop_vis_colour

prop_removable:    &prop_removable
  Pset_ElementComponentCommon.Weight: 
    valueType: Integer | Real 

prop_e_voltage: &prop_e_voltage
  Pset_ElectricalDeviceCommon.RatedVoltage: 
    valueType: Integer

prop_e_current: &prop_e_current
  Pset_ElectricalDeviceCommon.RatedCurrent: 
    valueType: Integer | Real
  

prop_e_nompower: &prop_e_nominalpower
  Pset_ElectricalDeviceCommon.NominalPowerConsumption: 
    valueType: Integer | Real 

prop_e_nomfreq: &prop_e_nominal_frequency
  Pset_ElectricalDeviceCommon.NominalFrequency:
    valueType: String
    
prop_e_nomfreq: &prop_e_nominal_frequency_range
  Pset_ElectricalDeviceCommon.NominalFrequencyRange:
    valueType: String
    
prop_e_IP: &prop_e_insulation
  Pset_ElectricalDeviceCommon.InsulationStandardClass:
    valueType: String
    allowedValues:
      - 0
      - I
      - II
      - III

prop_e_IP: &prop_e_IP
  Pset_ElectricalDeviceCommon.IP_Code:
    valueType: String

prop_e_IP: &prop_e_IK
  Pset_ElectricalDeviceCommon.IK_Code:
    valueType: String

prop_e:     &prop_e
  <<: *prop_e_voltage
  <<: *prop_e_IP

prop_e_case:     &prop_e_casing
  <<: *prop_e_nominalpower
  <<: *prop_e_IP
  
prop_e_sens:     &prop_e_sensor
  <<: *prop_e
  <<: *prop_e_insulation

prop_equipment: &prop_equipment
  <<: *prop_e_sensor
  <<: *prop_e_current
  <<: *prop_e_nominalpower
  <<: *prop_e_nominal_frequency
  <<: *prop_removable
  
prop_equipment: &prop_equipment_s6
  <<: *prop_equipment
  <<: *prop_e_nominal_frequency_range
  
prop_equipment: &prop_equipment_ik
  <<: *prop_equipment
  <<: *prop_e_IK


ifc_linear:     &type_linear
  - IfcFlowSegment
  - IfcFlowSegmentType
  - IfcFlowSegmentTypeEnum
  
ifc_e:     &type_e
  - IfcSensor
  - IfcSensorType
  - IfcDistributionControlElement
  - IfcDistributionControlElementType
  - IfcDistributionControlElementTypeEnum

ifc_zone:  &type_zone
  - IfcSpace
  - IfcSpaceType


