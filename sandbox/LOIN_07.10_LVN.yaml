prop:     &prop
  VVK.Name: 
    descr: Elemento pavadinimas
    valueType: String
  VVK.Decription: 
    descr: Elemento aprašymas projekto kiekių žiniaraščiuose
    valueType: String
  VVK.ElementType: 
    descr: Unikalus elemento tipo žymėjimas projekto dalyje
    valueType: String
  Pset_ConstructionAdministration.SpecificationSectionNumber: 
    valueType: String
  Pset_ElementComponentCommon.Status: 
    valueType: String
  Pset_ElementCommon.System: 
    valueType: String

prop_FR:    &prop_FR
  Pset_ElementComponentCommon.FireRating:
    type: IfcLabel
    valueType: String
    allowedValues:
    - R [15 | 20 | 30 | 45 | 60 | 90 | 120 | 180]
    - E [15 | 20 | 30 | 45 | 60 | 90 | 120 | 180]
    - I [15 | 20 | 30 | 45 | 60 | 90 | 120 | 180]
    - EI [15 | 20 | 30 | 45 | 60 | 90 | 120 | 180]
    - REI [15 | 20 | 30 | 45 | 60 | 90 | 120 | 180]
    - R-M [15 | 20 | 30 | 45 | 60 | 90 | 120 | 180]
  
prop_u:     &prop_u
  <<: *prop
  VVK.Mark: 
    descr: Unikalus elemento žymėjimas projekto dalyje
    valueType: String

prop_g:   &prop_g_l
  Pset_QuantityTakeOff.Length:
    valueType: Integer | Real

prop_g:   &prop_g_h
  Pset_QuantityTakeOff.Height:
    valueType: Integer | Real

prop_g:   &prop_g_w
  Pset_QuantityTakeOff.Width:
    valueType: Integer | Real

prop_ga:   &prop_g_a
  Pset_QuantityTakeOff.Area: {}

prop_g_vol: &prop_g_v
  Pset_QuantityTakeOff.Volume:
    valueType: Integer | Real

prop_thick:     &prop_g_t
  Pset_ElementComponentCommon.Thickness:
    valueType: Integer | Real

prop_g_d:   &prop_g_d
  Pset_ElementComponentCommon.Diameter:
    valueType: Integer

prop_g_DN:   &prop_g_dn
  Pset_ElementComponentCommon.NominalDiameter:
    valueType: Integer
    
prop_g_cmpx:   &prop_g_cmpx
  Pset_ElementComponentCommon.ComplexDimensions:
    valueType: String

prop_g:   &prop_g
  <<: *prop_g_l
  <<: *prop_g_h
  <<: *prop_g_w

prop_ga:   &prop_g_area
  <<: *prop_g
  <<: *prop_g_a
  
  
prop_g_well: &prop_g_well
  Pset_QuantityTakeOff.Height:
    valueType: Integer | Real
    descr: Šulinio ar kameros aukštis nuo dugno iki viršutinės perdangos, nevertinant įlipimo dalies aukščio
  Pset_ElementComponentCommon.Diameter:
    valueType: Integer
    descr: Apvalaus šulinio diametras
#  Pset_QuantityTakeOff.Width:
#    descr: Stačiakampio šulinio ar kameros plotis plane
#    memo: Jei taikoma
#  Pset_QuantityTakeOff.Length:
#    descr: Stačiakampio šulinio ar kameros ilgis plane


prop_g_well: &prop_g_well_camera
  Pset_QuantityTakeOff.Height:
    valueType: Integer
    descr: Šulinio ar kameros aukštis nuo dugno iki viršutinės perdangos, nevertinant įlipimo dalies aukščio
#  Pset_QuantityTakeOff.Diameter: 
#    descr: Apvalaus šulinio diametras
  Pset_QuantityTakeOff.Width:
    descr: Stačiakampio šulinio ar kameros plotis plane
  Pset_QuantityTakeOff.Length:
    valueType: Integer | Real
    descr: Stačiakampio šulinio ar kameros ilgis plane

prop_thick:     &prop_g_thickness
  <<: *prop_g_l
  <<: *prop_g_t


prop_g_valve:   &prop_g_valve
  <<: *prop_g_dn
  
prop_g_conn_multi:   &prop_g_conn_multi
  <<: *prop_g_cmpx

prop_g_pipe:   &prop_g_pipe
  <<: *prop_g_l
  <<: *prop_g_d
  <<: *prop_g_dn


prop_v_mat:     &prop_material
  VVK.Material:
    valueType: String
    # allowedValues:
    # - Plastikas
    # - Betonas
    # - PVC

prop_v_fin:     &prop_finish
  VVK.Finish:
    valueType: String

prop_v_col:     &prop_colour
  VVK.Colour:
    valueType: String
  
prop_vis:     &prop_vis
  <<: *prop_material
  <<: *prop_finish
  <<: *prop_colour

prop_c_VFR: &prop_c_VFR
  Pset_ElementComponentCommon.VolumetricFlowRate: 
    valueType: Integer | Real

prop_c_ext:  &prop_external
  Pset_ElementComponentCommon.IsExternal: {}

prop_c_PE:  &prop_PE
  Pset_ElementComponentCommon.HasProtectiveEarth:
    valueType: String
  
#
# electrical properties
#
prop_e_v: &prop_e_v
  Pset_ElectricalDeviceCommon.RatedVoltage: 
    valueType: Integer
    
prop_e_ip:     &prop_e_ip
  Pset_ElectricalDeviceCommon.IP_Code:
    valueType: String

prop_e_ik:     &prop_e_ik
  Pset_ElectricalDeviceCommon.IK_Code:
    valueType: String

prop_e_ic:     &prop_e_ic
  Pset_ElectricalDeviceCommon.InsulationStandardClass:
    valueType: String

prop_e_npc: &prop_e_npc
  Pset_ElectricalDeviceCommon.NominalPowerConsumption: 
    valueType: Integer | Real

prop_e_nfr: &prop_e_nFR
  Pset_ElectricalDeviceCommon.NominalFrequencyRange: 
    valueType: String
    
prop_e_sens:     &prop_e_sensor
  <<: *prop_e_ip
  <<: *prop_e_ik
  <<: *prop_e_ic
  
prop_e:     &prop_e
  <<: *prop_e_npc
  <<: *prop_e_sensor

prop_e_cable:     &prop_e_cable
  <<: *prop_e_ic
  <<: *prop_FR

prop_e_device:    &prop_e_device
  <<: *prop_e_ip
  <<: *prop_e_ik
  <<: *prop_e_ic
  <<: *prop_e_v
  <<: *prop_e_npc
  
prop_e_device: &prop_e_device_s4
  <<: *prop_e_v
  <<: *prop_e_npc
  <<: *prop_e_nFR
  <<: *prop_e_ip
  <<: *prop_e_ik
  <<: *prop_e_ic
  <<: *prop_PE
  <<: *prop_external


ifc_sens:    &type_sensor
  - IfcSensor
  - IfcSensorType
  - IfcSensorTypeEnum
  
ifc_linear:  &type_linear
  - IfcFlowSegment
  - IfcFlowSegmentType
  - IfcFlowSegmentTypeEnum
  
ifc_e:       &type_e
  - IfcDistributionControlElement
  - IfcDistributionControlElementType
  - IfcDistributionControlElementTypeEnum
  
ifc_w:       &type_well
  - IfcFlowTerminal
  - IfcFlowTerminalElementType
  - IfcFlowTerminalElementTypeEnum

ifc_cover:    &type_covering
  - IfcCovering
  
ifc_plate: &type_plate
  - IfcPlate
  - IfcPlateType

ifc_f:       &type_flow
  - IfcFlowController
  - IfcFlowControllerType
  - IfcFlowControllerTypeEnum
  
ifc_post: &type_post
  - IfcColumn
  - IfcColumnType
  
ifc_foot:  &type_footing
  - IfcPile
  - IfcPileType

ifc_zone:  &type_zone
  - IfcSpace
  - IfcSpaceType
  
