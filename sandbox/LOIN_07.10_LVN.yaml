#
# project file
#
LVN:
    id: "07.10"
    name: Vandentiekis ir nuotekų šalinimas. Lauko tinklai
    stages:
      s1:
        lod: 275
        log: 2
      s2:
        lod: 200
        log: 2
      s3:
        lod: 200
        log: 2
      s4:
        lod: 300
        log: 2
        properties:
          VVK.RelatedDocumentationURI:
            valueType: String
          
      s5:
        lod: 300
        log: 2
        properties:
          Pset_ManufacturerTypeInformation.ArticleNumber:
            valueType: String
          Pset_ManufacturerTypeInformation.Manufacturer:
            valueType: String
      s6:
        lod: 300
        log: 2
        properties:
          Pset_Warranty.WarrantyStartDate:
            descr: Garantijos pradžios data
            valueType: String
          Pset_Warranty.WarrantyPeriod:
            descr: Garantijos terminas, mėnesiais
            valueType: Integer
          Pset_Warranty.PointOfContact:
            descr: Garantiją suteikiančios įmonęs kontaktai
            valueType: String

    elements:
#
# vandens tiekimo sustema, F.JB
#
    - id: Vandentiekio šulinys                                  #  NSIK+ISO:  F.JB.XMC
      examples:
      - Apžiūros šulinys
      - Inspektavimo šulinys
      - Inžinerinių tinklu kamera
      - Komunikacijų šulinys
      classifications:
        NSIK: "<L>F.JB.XMC"
        
        NSIK LF: F
        NSIK LT: JB
        NSIK LK: XMC
        
        ISO81346 CF: F
        ISO81346 CT: JB
        ISO81346 CC: XMC
        
        # Uniclass EF: ""
        # Uniclass Ss: ""
        # Uniclass Pr: Pr_60_50
        
      ifcType: *type_well
      stages:
        <<: *stages_well

    - id: Vandentiekio talpa                                    #  NSIK+ISO:  F.JB.CMA
      classifications:
        NSIK: "<L>F.JB.CMA"
        
        NSIK LF: F
        NSIK LT: JB
        NSIK LK: CMA
        
        ISO81346 CF: F
        ISO81346 CT: JB
        ISO81346 CC: CMA
        
      ifcType: *type_well
      stages:  
        <<: *stages_tank
        
